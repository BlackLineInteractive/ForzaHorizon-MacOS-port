# Statically linked XAPI routines replaced by native SDK implementations.
[rexcrt]
# Fibers. The guest versions save/restore GPRs and return into another fiber's
# LR, which cannot work for recompiled code (the host stack does not move).
# Same XAPI build as Halo: Reach (identical code, see RecompiledHaloReach's
# hints/rexcrt.toml); KTHREAD (PCR+0x100) +0x164 holds the current fiber.
# GetCurrentFiber (0x830EBC60) only reads that field and stays guest code.
ConvertThreadToFiber = 0x830EBC70
ConvertFiberToThread = 0x830EBD00
CreateFiber = 0x830EBD50
DeleteFiber = 0x830EBE30
SwitchToFiber = 0x830EBE90

[functions]
# SwitchToFiber's body (the thunk above is `b 0x830ED910`): full thread context
# save (GPRs, FPRs, VMX128) into the current fiber, placed after a no-return call.
0x830ED910 = { name = "FiberContextSave_830ED910" }
